apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "mesada.fullname" . }}-db-init
  labels:
    {{- include "mesada.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
data:
  init.sql: |
    -- Bootstrap mínimo do Supabase self-hosted (idempotente).
    -- Cria schema auth + roles usados por GoTrue/PostgREST.
    -- Evita que as tabelas do GoTrue caiam no access method orioledb
    -- (extensão ausente neste database) — usa heap, padrão do Postgres.
    ALTER DATABASE postgres SET default_table_access_method = heap;
    CREATE SCHEMA IF NOT EXISTS auth;
    DO $$
    BEGIN
      IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'anon') THEN
        CREATE ROLE anon NOLOGIN NOINHERIT;
      END IF;
      IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'authenticated') THEN
        CREATE ROLE authenticated NOLOGIN NOINHERIT;
      END IF;
      IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'service_role') THEN
        CREATE ROLE service_role NOLOGIN NOINHERIT BYPASSRLS;
      END IF;
    END
    $$;
    ALTER SCHEMA auth OWNER TO postgres;
    GRANT USAGE ON SCHEMA public TO anon, authenticated, service_role;
    GRANT USAGE ON SCHEMA auth TO postgres;
    ALTER DEFAULT PRIVILEGES FOR ROLE postgres IN SCHEMA public
      GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO anon, authenticated, service_role;
    ALTER DEFAULT PRIVILEGES FOR ROLE postgres IN SCHEMA public
      GRANT USAGE, SELECT ON SEQUENCES TO anon, authenticated, service_role;
