{{- if .Values.ingress.enabled }}
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: {{ include "mesada.fullname" . }}-ingress
  labels:
    {{- include "mesada.labels" . | nindent 4 }}
spec:
  entryPoints:
    {{- toYaml .Values.ingress.entrypoints | nindent 4 }}
  routes:
    - match: Host(`{{ .Values.ingress.host }}`) && PathPrefix(`{{ .Values.ingress.path }}`)
      kind: Rule
      {{- with .Values.ingress.middlewares }}
      middlewares:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      services:
        - name: {{ include "mesada.fullname" . }}-kong
          port: 8000
  {{- if .Values.ingress.tls }}
  tls:
    certResolver: {{ .Values.ingress.certResolver | quote }}
  {{- end }}
{{- end }}
