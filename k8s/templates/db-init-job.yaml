# Job de bootstrap do banco: garante schema auth + roles antes do auth/rest.
# Hook pre-install/pre-upgrade para reparar clusters já instalados sem recreate do PVC.
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "mesada.fullname" . }}-db-init
  labels:
    {{- include "mesada.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-5"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 5
  activeDeadlineSeconds: 300
  template:
    metadata:
      labels:
        app: db-init
        {{- include "mesada.labels" . | nindent 8 }}
    spec:
      restartPolicy: Never
      containers:
        - name: db-init
          image: {{ .Values.postgres.image }}
          env:
            - name: PGHOST
              value: {{ include "mesada.fullname" . }}-db
            - name: PGPORT
              value: '5432'
            - name: PGUSER
              value: {{ .Values.postgres.user | quote }}
            - name: PGDATABASE
              value: {{ .Values.postgres.db | quote }}
            - name: PGPASSWORD
              valueFrom: { secretKeyRef: { name: {{ include "mesada.fullname" . }}-secrets, key: postgres-password } }
          command: [sh, -c]
          args:
            - |
              until pg_isready -h "$PGHOST" -U "$PGUSER" -d "$PGDATABASE"; do
                echo "waiting for postgres..."; sleep 2;
              done;
              psql -v ON_ERROR_STOP=1 -f /sql/init.sql
          volumeMounts: [{ name: init-sql, mountPath: /sql }]
      volumes:
        - name: init-sql
          configMap: { name: {{ include "mesada.fullname" . }}-db-init }
