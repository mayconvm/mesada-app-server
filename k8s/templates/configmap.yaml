apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "mesada.fullname" . }}-kong-config
  labels:
    {{- include "mesada.labels" . | nindent 4 }}
data:
  kong.yml: |
    _format_version: '2.1'
    _transform: true
    services:
      - name: auth-v1
        url: http://{{ include "mesada.fullname" . }}-auth:9999/
        routes:
          - name: auth-v1-all
            strip_path: true
            paths:
              - /auth/v1/
        plugins:
          - name: cors
      - name: rest-v1
        url: http://{{ include "mesada.fullname" . }}-rest:3000/
        routes:
          - name: rest-v1-all
            strip_path: true
            paths:
              - /rest/v1/
        plugins:
          - name: cors
      - name: functions-v1
        url: http://{{ include "mesada.fullname" . }}-functions:9000/
        routes:
          - name: functions-v1-all
            strip_path: true
            paths:
              - /functions/v1/
        plugins:
          - name: cors
    plugins:
      - name: cors
        config:
          origins:
            - '*'
          methods:
            - GET
            - HEAD
            - PUT
            - PATCH
            - POST
            - DELETE
            - OPTIONS
          headers:
            - authorization
            - x-client-info
            - apikey
            - content-type
          credentials: true
          max_age: 3600
