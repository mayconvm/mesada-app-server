{{- if .Values.functions.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "mesada.fullname" . }}-functions
  labels:
    {{- include "mesada.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels: { app: functions }
  template:
    metadata:
      labels:
        app: functions
        {{- include "mesada.labels" . | nindent 8 }}
    spec:
      initContainers:
        - name: code-loader
          image: {{ .Values.functions.loaderImage }}
          command: [sh, -c]
          args:
            - |
              set -eu
              for f in /src/*; do
                [ -e "$f" ] || continue
                rel=$(basename "$f" | sed 's/___/\//g')
                mkdir -p "/code/$(dirname "$rel")"
                cp "$f" "/code/$rel"
              done
              find /code -type f | sort
          volumeMounts:
            - { name: code-src, mountPath: /src, readOnly: true }
            - { name: code, mountPath: /code }
      containers:
        - name: functions
          image: {{ .Values.functions.image }}
          args: ["start", "--main-service", "/home/deno/functions/main"]
          env:
            - name: SUPABASE_URL
              value: http://{{ include "mesada.fullname" . }}-kong:8000
            - name: SUPABASE_ANON_KEY
              valueFrom: { secretKeyRef: { name: {{ include "mesada.fullname" . }}-secrets, key: anon-key } }
            - name: SUPABASE_SERVICE_ROLE_KEY
              valueFrom: { secretKeyRef: { name: {{ include "mesada.fullname" . }}-secrets, key: service-role-key } }
            - name: JWT_SECRET
              valueFrom: { secretKeyRef: { name: {{ include "mesada.fullname" . }}-secrets, key: jwt-secret } }
            - name: VERIFY_JWT
              value: {{ .Values.functions.verifyJwt | quote }}
          ports: [{ containerPort: 9000 }]
          volumeMounts: [{ name: code, mountPath: {{ .Values.functions.functionsPath }} }]
      volumes:
        - name: code
          emptyDir: {}
        - name: code-src
          configMap:
            name: {{ include "mesada.fullname" . }}-functions
{{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "mesada.fullname" . }}-functions
  labels:
    {{- include "mesada.labels" . | nindent 4 }}
spec:
  selector: { app: functions }
  ports: [{ port: 9000, targetPort: 9000 }]
